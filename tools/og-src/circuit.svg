<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#07090f"/>
  <circle cx="930" cy="315" r="300" fill="url(#g)"/>

  <!-- 电路：电源 → 并联两支 → 串一个 -->
  <g stroke="#f5b942" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M790 200 L860 200"/>
    <path d="M860 200 L860 160 L960 160"/>
    <path d="M860 200 L860 240 L960 240"/>
    <path d="M1024 160 L1080 160 L1080 200"/>
    <path d="M1024 240 L1080 240 L1080 200"/>
    <path d="M1080 200 L1116 200 L1116 400 L790 400 L790 200"/>
    <path d="M900 400 L940 400" stroke="#07090f" stroke-width="9"/>
  </g>
  <!-- 电阻方块 -->
  <g fill="#161f2c" stroke="#a78bfa" stroke-width="3">
    <rect x="960" y="142" width="64" height="36" rx="6"/>
    <rect x="960" y="222" width="64" height="36" rx="6"/>
    <rect x="888" y="382" width="64" height="36" rx="6"/>
  </g>
  <g font-family="JetBrains Mono,PingFang SC,monospace" font-size="19" font-weight="700" fill="#a78bfa" text-anchor="middle">
    <text x="992" y="167">6Ω</text>
    <text x="992" y="247">3Ω</text>
    <text x="920" y="407">2Ω</text>
  </g>
  <!-- 电源 -->
  <g stroke="#38bdf8" stroke-width="3">
    <line x1="762" y1="278" x2="762" y2="322"/>
    <line x1="778" y1="290" x2="778" y2="310"/>
    <line x1="790" y1="200" x2="790" y2="278"/>
    <line x1="790" y1="322" x2="790" y2="400"/>
    <line x1="762" y1="300" x2="734" y2="300" stroke="#07090f" stroke-width="9"/>
  </g>
  <text x="700" y="308" font-family="JetBrains Mono,PingFang SC,monospace" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="end">12V</text>

  <rect x="80" y="150" width="58" height="5" rx="2.5" fill="#f5b942"/>
  <text x="80" y="244" font-family="PingFang SC,Helvetica,sans-serif" font-size="56" font-weight="700" fill="#e8eef8">电路搭建台</text>
  <text x="80" y="300" font-family="PingFang SC,Helvetica,sans-serif" font-size="26" fill="#9aabc2">串并联 · 欧姆定律</text>
  <g font-family="PingFang SC,Helvetica,sans-serif" font-size="23" fill="#7d8da3">
    <text x="80" y="364">改任意一个阻值，整条电路立刻跟着变</text>
  </g>
  <rect x="80" y="396" width="440" height="58" rx="12" fill="#111823" stroke="rgba(251,113,133,.34)"/>
  <text x="104" y="433" font-family="PingFang SC,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fb7185">并联放一个 0Ω，它会当场冒烟</text>
  <text x="80" y="502" font-family="JetBrains Mono,PingFang SC,monospace" font-size="21" fill="#a3e635">I = U / R</text>
  <text x="80" y="562" font-family="PingFang SC,Helvetica,sans-serif" font-size="23" fill="#f5b942">学习实验室 · Learn Lab</text>
</svg>

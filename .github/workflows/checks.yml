name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 目前所有校验只用标准库，不装依赖。
      # 若将来引入 Pillow 等（例如把 OG 生成也接进来），在这里加 pip install。
      - name: 跑全站校验
        run: python3 tools/check_all.py

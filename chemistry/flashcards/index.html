 "redox", "q": "钠 投入 水中", "hint": "钠被氧化，水中的氢被还原", "eqPretty": "2Na + 2H₂O = 2NaOH + H₂↑", "note": "氧化剂是 H₂O（其中 +1 价 H 得电子），还原剂是 Na。现象：浮、熔、游、响、红。"}, {"id": "redox-02", "cat": "redox", "q": "钠 在空气中 燃烧", "hint": "生成的不是氧化钠", "eqPretty": "2Na + O₂ = Na₂O₂", "note": "常温缓慢氧化才得 Na₂O；点燃生成淡黄色的过氧化钠 Na₂O₂，其中氧为 −1 价。"}, {"id": "redox-03", "cat": "redox", "q": "过氧化钠 与 水", "hint": "Na₂O₂ 里的氧既升价又降价", "eqPretty": "2Na₂O₂ + 2H₂O = 4NaOH + O₂↑", "note": "歧化反应：−1 价氧一半升到 0 价（O₂），一半降到 −2 价（OH⁻）。Na₂O₂ 是供氧剂。"}, {"id": "redox-04", "cat": "redox", "q": "氯气 通入 氢氧化钠溶液（制漂白液）", "hint": "氯的歧化", "eqPretty": "Cl₂ + 2OH⁻ = Cl⁻ + ClO⁻ + H₂O", "note": "Cl₂ 中 0 价氯一半降到 −1（Cl⁻），一半升到 +1（ClO⁻）。ClO⁻ 是漂白的有效成分。"}, {"id": "redox-05", "cat": "redox", "q": "铁 在 氯气中 燃烧", "hint": "氯气是强氧化剂，把铁氧化到最高价", "eqPretty": "2Fe + 3Cl₂ = 2FeCl₃", "note": "强氧化剂（Cl₂、稀硝酸）得 Fe³⁺；弱氧化剂（S、I₂、H⁺、Cu²⁺）得 Fe²⁺。"}, {"id": "redox-06", "cat": "redox", "q": "铁 与 硫 共热", "hint": "硫是弱氧化剂", "eqPretty": "Fe + S = FeS", "note": "和上一条对照记：同样是铁，遇 Cl₂ 到 +3，遇 S 只到 +2。"}, {"id": "redox-07", "cat": "redox", "q": "氢气 还原 氧化铜", "hint": "谁失电子谁是还原剂", "eqPretty": "H₂ + CuO = Cu + H₂O", "note": "H₂ 是还原剂（被氧化），CuO 是氧化剂（被还原）。黑色变红色。"}, {"id": "redox-08", "cat": "redox", "q": "氯化铁溶液 与 铁粉", "hint": "Fe³⁺ 有氧化性", "eqPretty": "2Fe³⁺ + Fe = 3Fe²⁺", "note": "归中反应：+3 和 0 价的铁都变成 +2。用来除去 FeCl₂ 溶液里混的 FeCl₃。"}, {"id": "redox-09", "cat": "redox", "q": "氯化铁溶液 与 铜", "hint": "Fe³⁺ 能溶解铜（蚀刻电路板）", "eqPretty": "2Fe³⁺ + Cu = 2Fe²⁺ + Cu²⁺", "note": "这条说明 Fe³⁺ 的氧化性强于 Cu²⁺。工业上用来蚀刻覆铜板。"}, {"id": "redox-10", "cat": "redox", "q": "氯气 通入 碘化钾溶液", "hint": "卤素单质氧化性 Cl₂ > I₂", "eqPretty": "Cl₂ + 2I⁻ = I₂ + 2Cl⁻", "note": "现象：溶液变黄褐，加淀粉变蓝。同理 Cl₂ 也能置换出 Br₂。"}, {"id": "redox-11", "cat": "redox", "q": "铝 与 氢氧化钠溶液", "hint": "铝既能与酸反应，也能与强碱反应", "eqPretty": "2Al + 2OH⁻ + 2H₂O = 2AlO₂⁻ + 3H₂↑", "note": "⚠️ 教材版本不同写法不同，两种都对，按你用的课本写：人教版写 AlO₂⁻（偏铝酸根），鲁科版等写 [Al(OH)₄]⁻（四羟基合铝酸根），后者对应 2Al + 2OH⁻ + 6H₂O = 2[Al(OH)₄]⁻ + 3H₂↑。铝的两性是考点：既溶于强酸也溶于强碱。"}, {"id": "redox-12", "cat": "redox", "q": "铜 与 浓硫酸 共热", "hint": "浓硫酸的强氧化性来自 +6 价硫，不是 H⁺", "eqPretty": "Cu + 2H₂SO₄ = CuSO₄ + SO₂↑ + 2H₂O", "note": "稀硫酸不与铜反应。这里被还原的是 S（+6 → +4），不是氢。"}, {"id": "cls-01", "cat": "class", "q": "氧化铁 与 稀盐酸（除铁锈）", "hint": "碱性氧化物 + 酸 → 盐 + 水", "eqPretty": "Fe₂O₃ + 6H⁺ = 2Fe³⁺ + 3H₂O", "note": "Fe₂O₃ 是碱性氧化物。铁锈主要成分即 Fe₂O₃·xH₂O。"}, {"id": "cls-02", "cat": "class", "q": "二氧化碳 与 氢氧化钠溶液（NaOH 足量）", "hint": "酸性氧化物 + 碱 → 盐 + 水", "eqPretty": "CO₂ + 2OH⁻ = CO₃²⁻ + H₂O", "note": "CO₂ 过量时生成 HCO₃⁻：CO₂ + OH⁻ = HCO₃⁻。量的多少决定产物。"}, {"id": "cls-03", "cat": "class", "q": "氧化钙 与 水（生石灰变熟石灰）", "hint": "碱性氧化物 + 水 → 碱", "eqPretty": "CaO + H₂O = Ca(OH)₂", "note": "放出大量热。工地上用它，食品干燥剂也用它。"}, {"id": "cls-04", "cat": "class", "q": "碳酸钙 高温分解（工业制生石灰）", "hint": "分解反应", "eqPretty": "CaCO₃ = CaO + CO₂↑", "note": "高温条件。石灰石烧成生石灰，是水泥与钢铁工业的基础反应之一。"}, {"id": "cls-05", "cat": "class", "q": "硫酸铜溶液 与 氢氧化钠溶液", "hint": "复分解，生成蓝色沉淀", "eqPretty": "Cu²⁺ + 2OH⁻ = Cu(OH)₂↓", "note": "复分解反应发生的条件：生成沉淀、气体或弱电解质（如水）。"}, {"id": "cls-06", "cat": "class", "q": "三氧化硫 与 水", "hint": "酸性氧化物 + 水 → 酸", "eqPretty": "SO₃ + H₂O = H₂SO₄", "note": "SO₃ 是硫酸的酸酐。工业接触法制硫酸的最后一步（实际用浓硫酸吸收）。"}, {"id": "cls-07", "cat": "class", "q": "氯气 溶于水（新制氯水）", "hint": "HClO 是弱酸，不能拆", "eqPretty": "Cl₂ + H₂O = H⁺ + Cl⁻ + HClO", "note": "HClO 是弱电解质，写化学式不拆。氯水的漂白和杀菌靠的是 HClO，不是 Cl₂ 本身。见光会分解：2HClO = 2HCl + O₂↑，所以要现用现配、避光保存。"}, {"id": "cls-08", "cat": "class", "q": "氢气 在 氯气中 燃烧", "hint": "化合反应", "eqPretty": "H₂ + Cl₂ = 2HCl", "note": "苍白色火焰，瓶口有白雾（HCl 与空气中水蒸气形成盐酸小液滴）。"}];

    {k:'class', n:'物质分类'}
  ];
  var CATNAME = {ion:'离子反应', redox:'氧化还原', class:'物质分类与转化'};
  var KEY = 'learnlab.flashcards.v1';

  var state = load();
  var cat = 'all', queue = [], cur = null, flipped = false;

  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      return {known: s.known || {}, wrong: s.wrong || {}};
    }catch(e){ return {known:{}, wrong:{}}; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function pool(){
    return CARDS.filter(function(c){ return cat === 'all' || c.cat === cat; });
  }
  function build(){
    var p = pool();
    // 错题优先，其次没背过的，最后已会的
    var wrong = p.filter(function(c){ return state.wrong[c.id]; });
    var fresh = p.filter(function(c){ return !state.wrong[c.id] && !state.known[c.id]; });
    queue = shuffle(wrong).concat(shuffle(fresh));
  }
  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function progress(){
    var p = pool();
    var done = p.filter(function(c){ return state.known[c.id]; }).length;
    var w = p.filter(function(c){ return state.wrong[c.id]; }).length;
    document.getElementById('barFill').style.width = p.length ? (done/p.length*100)+'%' : '0';
    document.getElementById('cnt').innerHTML = '已掌握 <b>'+done+'</b> / '+p.length;
    var wp = document.getElementById('wrongPill');
    wp.hidden = !w; wp.textContent = '错题 '+w;
  }

  function render(){
    var st = document.getElementById('stage');
    if(!cur){
      var p = pool();
      var allKnown = p.length && p.every(function(c){ return state.known[c.id]; });
      st.innerHTML = '<div class="card"><div class="done">'
        + '<h2>'+(allKnown ? '这一组你全过了 🎉' : '这一轮结束')+'</h2>'
        + '<p>'+(allKnown
            ? '想巩固可以清空进度重来，或者换一个分类。'
            : '剩下的都标成「会了」了。换个分类，或清空进度再练一轮。')+'</p>'
        + '<button class="act primary" id="again" style="max-width:220px;margin:0 auto">再来一轮</button>'
        + '</div></div>';
      document.getElementById('again').onclick = function(){
        build();
        if(!queue.length){ // 全会了：把这一组重置成未背状态
          pool().forEach(function(c){ delete state.known[c.id]; });
          save(); build();
        }
        next();
      };
      progress();
      return;
    }
    var c = cur;
    st.innerHTML = '<div class="card">'
      + '<div class="tag" data-c="'+c.cat+'">'+CATNAME[c.cat]+'</div>'
      + '<div class="q">'+esc(c.q)+'</div>'
      + '<div class="hint">'+esc(c.hint)+'</div>'
      + (flipped
          ? '<div class="ans"><div class="eq">'+esc(c.eqPretty)+'</div>'
            + '<div class="note">'+esc(c.note)+'</div></div>'
          : '')
      + '<div class="acts">'
      + (flipped
          ? '<button class="act bad" id="bad">还不会</button>'
            + '<button class="act good" id="good">会了</button>'
          : '<button class="act primary" id="flip">翻面看答案</button>')
      + '</div></div>';

    if(flipped){
      document.getElementById('good').onclick = function(){ mark(true); };
      document.getElementById('bad').onclick  = function(){ mark(false); };
    } else {
      document.getElementById('flip').onclick = function(){ flipped = true; render(); };
    }
    progress();
  }

  function mark(ok){
    if(ok){ state.known[cur.id] = 1; delete state.wrong[cur.id]; }
    else  { state.wrong[cur.id] = 1; delete state.known[cur.id]; }
    save();
    next();
  }
  function next(){
    cur = queue.shift() || null;
    flipped = false;
    render();
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }

  // 分类按钮
  var cw = document.getElementById('cats');
  CATS.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'cat'; b.textContent = c.n;
    b.setAttribute('aria-pressed', String(c.k === cat));
    b.onclick = function(){
      cat = c.k;
      Array.prototype.forEach.call(cw.children, function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
      build(); next();
    };
    cw.appendChild(b);
  });

  document.getElementById('total').textContent = CARDS.length;
  document.getElementById('reset').onclick = function(){
    state = {known:{}, wrong:{}}; save(); build(); next();
  };

  // 键盘：空格翻面，←不会 →会了
  document.addEventListener('keydown', function(e){
    if(!cur) return;
    if(e.code === 'Space'){ e.preventDefault(); if(!flipped){ flipped = true; render(); } }
    else if(flipped && e.key === 'ArrowRight'){ mark(true); }
    else if(flipped && e.key === 'ArrowLeft'){ mark(false); }
  });

  build(); next();
})();
</script>
</body>
</html>
